<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Карта мира</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    #back-to-menu {
  position: fixed;
  left: 15px;
  top: 15px;
  z-index: 1000;
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  text-decoration: none;
  padding: 10px 15px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: bold;
  font-family: inherit;
}
#back-to-menu:hover {
  background: rgba(255, 215, 0, 0.2);
}
      #map-wrap {
position: relative;
  width: 100vw;
  height: 100vh;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
}
    #map-img {
  display: block;
  max-width: 100%;
  max-height: 100vh;
  width: auto;
  height: auto;
  object-fit: contain;
}
#map-box {
  position: relative;
  max-width: 100%;
  max-height: 100vh;
  display: inline-block;
  line-height: 0;
    }
.city-icon {
  position: absolute;
  width: 25px;
  height: 25px;
  transform: translate(-50%, -50%);
  cursor: pointer;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.9));
  transition: transform 0.15s;
}
.city-icon:active {
  transform: translate(-50%, -50%) scale(1.25);
}
.city-label {
  position: absolute;
  transform: translate(-50%, 0);
  margin-top: 14px;        /* = 12px (половина иконки 25) + 6px зазор */
  color: #fff;
  font-size: 9px;
  font-weight: bold;
  text-shadow: 0 0 4px #000, 0 0 4px #000, 0 0 4px #000;
  pointer-events: none;
  white-space: normal;      /* ← обязательно normal, не nowrap */
  text-align: center;        /* ← для центрирования строк */
  line-height: 1;          /* ← компактный интервал */
}
@media (min-width: 900px) {
  .city-icon {
    width: 55px;
    height: 55px;
  }
  .city-label {
    margin-top: 30px;      /* = 27px (половина иконки 55) + 7px зазор */
    font-size: 14px;
  }
}
    #hint {
      position: fixed; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.85); color: #fff;
      padding: 20px 30px; border-radius: 12px;
      text-align: center; font-size: 15px; line-height: 1.5;
      max-width: 300px;
    }
  </style>
</head>
<body>
  <a href="menu.html" id="back-to-menu">⬅ В меню</a>
<div id="map-wrap">
  <div id="map-box">
    <img id="map-img" src="map.jpg" alt="Карта">
  </div>
</div>
  <script>
      const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const wrap = document.getElementById('map-box');

    fetch('cities.json')
      .then(r => r.json())
      .then(data => {
        const cities = Object.entries(data);
        if (cities.length === 0) { showHint(); return; }
        cities.forEach(([name, info]) => renderCity(name, info));
      })
      .catch(() => {});

    function renderCity(name, info) {
      const icon = document.createElement('img');
      icon.className = 'city-icon';
      icon.src = info.icon;
      icon.style.left = info.x + '%';
      icon.style.top = info.y + '%';
      icon.onclick = () => { window.location.href = info.article; };
      icon.onerror = () => { icon.style.display = 'none'; };
      wrap.appendChild(icon);

      const label = document.createElement('div');
      label.className = 'city-label';
      label.style.left = info.x + '%';
      label.style.top = info.y + '%';
      label.innerHTML = info.label || name;
      wrap.appendChild(label);
    }

    function showHint() {
      const h = document.createElement('div');
      h.id = 'hint';
      h.innerHTML = '🗺 Карта пока пустая.<br>Добавь первый город в cities.json.';
      document.body.appendChild(h);
    }
  </script>
</body>
</html>
