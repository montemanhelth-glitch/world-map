<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Персонажи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* --- ОБЩИЙ ФОН И ШРИФТЫ --- */
    body {
      background: #05050a; /* Более глубокий темный фон */
      background-image: radial-gradient(circle at top, #15152a 0%, #05050a 100%);
      color: #eee;
      font-family: -apple-system, sans-serif;
      padding-bottom: 60px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* --- КНОПКА НАЗАД --- */
    #back {
      position: fixed; left: 15px; top: 15px;
      background: rgba(0,0,0,0.8); border: 1px solid #ffd700;
      color: #ffd700; padding: 10px 18px;
      border-radius: 25px; font-size: 14px; font-weight: bold;
      cursor: pointer; z-index: 100;
      transition: 0.3s;
      text-decoration: none;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
      backdrop-filter: blur(5px);
    }
    #back:hover { 
      background: rgba(255, 215, 0, 0.15); 
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
      transform: translateY(-2px);
    }

    /* --- ЗАГОЛОВОК --- */
    .header { 
      text-align: center; 
      padding: 90px 20px 40px; 
      position: relative;
    }
    .header h1 { 
      font-size: 36px; 
      color: #ffd700; 
      text-shadow: 0 0 20px rgba(255, 215, 0, 0.5); 
      margin-bottom: 10px;
      letter-spacing: 2px;
    }
    .header p { 
      color: #8a8a9d; 
      font-size: 16px; 
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* --- СЕТКА ПЕРСОНАЖЕЙ --- */
    .characters-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr); /* На телефоне 2 колонки */
      gap: 20px;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .characters-grid {
        grid-template-columns: repeat(3, 1fr); /* На ПК 3 колонки */
        gap: 30px;
        padding: 40px;
      }
    }

    /* --- КАРТОЧКА ПЕРСОНАЖА --- */
    .char-card {
      display: flex;
      flex-direction: column;
      background: #111118;
      border: 1px solid #2a2a3a;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      position: relative;
    }

    /* Эффект при наведении на карточку */
    .char-card:hover {
      transform: translateY(-8px) scale(1.02);
      border-color: #ffd700;
      box-shadow: 0 15px 40px rgba(255, 215, 0, 0.15), 0 0 20px rgba(255, 215, 0, 0.2);
    }

    .char-card img {
      width: 100%;
      aspect-ratio: 3 / 4; 
      object-fit: cover;
      object-position: top center; /* ← ВОТ ЭТА СТРОЧКА */
      border-bottom: 2px solid #1a1a25;
      background: #000;
      transition: 0.3s;
    }

    .char-card:hover img {
      filter: brightness(1.1);
    }

    .char-name {
      padding: 15px 10px;
      text-align: center;
      color: #d1d1e0;
      font-weight: bold;
      font-size: 17px;
      letter-spacing: 1px;
      background: linear-gradient(180deg, #181822 0%, #0d0d13 100%);
      transition: 0.3s;
    }
    
    .char-card:hover .char-name { 
      color: #ffd700; 
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
    }

    /* --- ВСПЛЫВАЮЩЕЕ ОКНО (МОДАЛЬНОЕ) --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9); 
      backdrop-filter: blur(8px); /* Сильное размытие фона */
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: #111118;
      border: 2px solid #ffd700;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 0 50px rgba(255, 215, 0, 0.2), 0 20px 50px rgba(0,0,0,0.9);
      transform: translateY(30px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Пружинистая анимация */
      overflow: hidden;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    /* Кнопка закрытия */
    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0,0,0,0.7);
      border: 1px solid #444;
      color: #fff;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .close-btn:hover { 
      background: #ffd700; 
      color: #000; 
      border-color: #ffd700;
      transform: rotate(90deg);
    }

    /* Картинка внутри окна */
    .modal-img {
      width: 100%;
      height: 350px; /* Сделал чуть выше для красоты */
      object-fit: cover;
      border-bottom: 2px solid #ffd700;
    }

    /* Текст внутри окна */
    .modal-info {
      padding: 25px;
      overflow-y: auto;
    }

    /* Стилизация скроллбара, если текст длинный */
    .modal-info::-webkit-scrollbar { width: 6px; }
    .modal-info::-webkit-scrollbar-track { background: #111; }
    .modal-info::-webkit-scrollbar-thumb { background: #ffd700; border-radius: 3px; }

    .modal-info h2 {
      color: #ffd700;
      font-size: 26px;
      margin-bottom: 5px;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
    }

    .modal-info .subtitle {
      color: #7a7a9a;
      font-size: 13px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .modal-info p {
      color: #b0b0c0;
      line-height: 1.7;
      font-size: 15px;
    }

  </style>
</head>
<body>

  <a href="menu.html" id="back">⬅ В меню</a>

  <div class="header">
    <h1>👤 Персонажи</h1>
    <p>Герои и злодеи континента Лэстрэл</p>
  </div>

  <div class="characters-grid">
    
    <!-- ПЕРСОНАЖ 1 -->
    <div class="char-card" 
         data-name="Каролина" 
         data-subtitle="Главная героиня" 
         data-desc="Новый член ордена 4 волшебников. Скромная девушка из поселения Бланс." 
         data-img="chararts/karolina.png">
      <img src="chararts/karolina.png" alt="Каролина">
      <div class="char-name">Каролина</div>
    </div>

    <!-- ПЕРСОНАЖ 2 -->
    <div class="char-card" 
         data-name="Некто" 
         data-subtitle="Главный герой" 
         data-desc="Новый член ордена 4 волшебников. Личность, чья история полна загадок." 
         data-img="chararts/nekto.jpg">
      <img src="chararts/nekto.jpg" alt="Некто">
      <div class="char-name">Некто</div>
    </div>

    <!-- ПЕРСОНАЖ 3 -->
    <div class="char-card" 
         data-name="Магнификус" 
         data-subtitle="Главный герой" 
         data-desc="Новый член ордена 4 волшебников. Дед параноик. Любит коверкать имена и кидаться едой во всех, кто ему непригляден. А так же падок на артефакты и изготовление зелий." 
         data-img="chararts/magnifikus.jpg">
      <img src="chararts/magnifikus.jpg" alt="Магнификус">
      <div class="char-name">Магнификус</div>
    </div>

    <!-- ПЕРСОНАЖ 4 -->
    <div class="char-card" 
         data-name="Эра безлунной ночи" 
         data-subtitle="Главная героиня" 
         data-desc="Новый член ордена 4 волшебников. Загадочная и пронырная эльфийка с буйным характером." 
         data-img="chararts/era.jpg">
      <img src="chararts/era.jpg" alt="Эра">
      <div class="char-name">Эра</div>
    </div>

  </div>

  <!-- ===== САМО ВСПЛЫВАЮЩЕЕ ОКНО ===== -->
  <div class="modal-overlay" id="charModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">✕</button>
      <img src="" id="modalImg" class="modal-img" alt="Персонаж">
      <div class="modal-info">
        <h2 id="modalName">Имя</h2>
        <div class="subtitle" id="modalSubtitle">Титул</div>
        <p id="modalDesc">Описание...</p>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const modal = document.getElementById('charModal');
    const closeBtn = document.getElementById('closeModal');
    
    const modalImg = document.getElementById('modalImg');
    const modalName = document.getElementById('modalName');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalDesc = document.getElementById('modalDesc');

    const cards = document.querySelectorAll('.char-card');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        // Плавная подмена данных перед показом
        modalName.textContent = card.getAttribute('data-name');
        modalSubtitle.textContent = card.getAttribute('data-subtitle');
        modalDesc.textContent = card.getAttribute('data-desc');
        modalImg.src = card.getAttribute('data-img');

        modal.classList.add('active');
      });
    });

    function closeModal() {
      modal.classList.remove('active');
    }

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });
  </script>
</body>
</html>
