<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Персонажи</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    /* --- КРАСОЧНЫЙ ФОН --- */
    body {
      background: #070810;
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(88, 28, 135, 0.3) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(14, 116, 144, 0.3) 0%, transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(190, 24, 93, 0.1) 0%, transparent 60%);
      background-attachment: fixed;
      color: #fff;
      font-family: -apple-system, sans-serif;
      padding-bottom: 60px;
      min-height: 100vh;
    }

    /* --- КНОПКА НАЗАД --- */
    #back {
      position: fixed; left: 15px; top: 15px;
      background: rgba(15, 15, 25, 0.8); border: 1px solid #a855f7;
      color: #d8b4fe; padding: 10px 18px;
      border-radius: 25px; font-size: 14px; font-weight: bold;
      cursor: pointer; z-index: 100;
      transition: 0.3s;
      text-decoration: none;
      box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
      backdrop-filter: blur(5px);
    }
    #back:hover { 
      background: rgba(168, 85, 247, 0.2); 
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.8);
      transform: translateY(-2px);
    }

    /* --- ЗАГОЛОВОК --- */
    .header { 
      text-align: center; 
      padding: 90px 20px 40px; 
    }
    .header h1 { 
      font-size: 38px; 
      background: linear-gradient(45deg, #38bdf8, #a855f7, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      letter-spacing: 2px;
      filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.4));
    }
    .header p { 
      color: #94a3b8; 
      font-size: 16px; 
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    /* --- СЕТКА ПЕРСОНАЖЕЙ --- */
    .characters-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      padding: 20px;
      max-width: 1100px;
      margin: 0 auto;
    }

    @media (min-width: 900px) {
      .characters-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 30px;
        padding: 40px;
      }
    }

    /* --- КАРТОЧКА ПЕРСОНАЖА --- */
    .char-card {
      display: flex;
      flex-direction: column;
      background: #11111a;
      border: 1px solid #334155;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      position: relative;
    }

    .char-card:nth-child(1):hover { border-color: #38bdf8; box-shadow: 0 0 30px rgba(56, 189, 248, 0.4); transform: translateY(-8px) scale(1.02); }
    .char-card:nth-child(2):hover { border-color: #a855f7; box-shadow: 0 0 30px rgba(168, 85, 247, 0.4); transform: translateY(-8px) scale(1.02); }
    .char-card:nth-child(3):hover { border-color: #f43f5e; box-shadow: 0 0 30px rgba(244, 63, 94, 0.4); transform: translateY(-8px) scale(1.02); }
    .char-card:nth-child(4):hover { border-color: #22c55e; box-shadow: 0 0 30px rgba(34, 197, 94, 0.4); transform: translateY(-8px) scale(1.02); }

    .char-card img {
      width: 100%;
      aspect-ratio: 3 / 4; 
      object-fit: cover;
      object-position: top center;
      border-bottom: 2px solid #1e293b;
      background: #000;
      transition: 0.3s;
    }

    .char-card:hover img {
      filter: brightness(1.1) contrast(1.1);
    }

    .char-name {
      padding: 15px 10px;
      text-align: center;
      color: #e2e8f0;
      font-weight: bold;
      font-size: 17px;
      letter-spacing: 1px;
      background: #0f0f18;
      transition: 0.3s;
    }
    
    .char-card:nth-child(1):hover .char-name { color: #38bdf8; }
    .char-card:nth-child(2):hover .char-name { color: #a855f7; }
    .char-card:nth-child(3):hover .char-name { color: #f43f5e; }
    .char-card:nth-child(4):hover .char-name { color: #22c55e; }

    /* --- ВСПЛЫВАЮЩЕЕ ОКНО (МОДАЛЬНОЕ) --- */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(3, 3, 10, 0.9); 
      backdrop-filter: blur(10px);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      display: flex;
      opacity: 1;
    }

    .modal-content {
      background: linear-gradient(180deg, #181826 0%, #0a0a12 100%);
      border: 1px solid #a855f7;
      border-radius: 20px;
      width: 100%;
      max-width: 420px;
      position: relative;
      box-shadow: 0 0 60px rgba(168, 85, 247, 0.2), 0 20px 50px rgba(0,0,0,0.9);
      transform: translateY(30px) scale(0.95);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .modal-overlay.active .modal-content {
      transform: translateY(0) scale(1);
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 15px;
      background: rgba(0,0,0,0.6);
      border: 1px solid #a855f7;
      color: #d8b4fe;
      width: 36px; height: 36px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 10;
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }
    .close-btn:hover { 
      background: #a855f7; 
      color: #fff; 
      transform: rotate(90deg) scale(1.1);
      box-shadow: 0 0 15px #a855f7;
    }

    .modal-img {
      width: 100%;
      height: 350px;
      object-fit: cover;
      object-position: top center;
      border-bottom: 2px solid #a855f7;
    }

    .modal-info {
      padding: 25px;
      overflow-y: auto;
    }

    .modal-info::-webkit-scrollbar { width: 6px; }
    .modal-info::-webkit-scrollbar-track { background: #0a0a12; }
    .modal-info::-webkit-scrollbar-thumb { background: #a855f7; border-radius: 3px; }

    .modal-info h2 {
      font-size: 28px;
      margin-bottom: 5px;
      background: linear-gradient(to right, #38bdf8, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .modal-info .subtitle {
      color: #f43f5e;
      font-size: 13px;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .modal-info p {
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 15px;
    }

  </style>
</head>
<body>

  <!-- === АУДИО ПЛЕЕР === -->
  <audio id="bg-music" loop>
    <source src="audio/music.mp3" type="audio/mpeg">
  </audio>

  <a href="menu.html" id="back">⬅ В меню</a>

  <div class="header">
    <h1>👤 Персонажи</h1>
    <p>Герои и злодеи континента Лэстрэл</p>
  </div>

  <div class="characters-grid">
    
    <!-- ПЕРСОНАЖ 1 -->
    <div class="char-card" 
         data-name="Каролина" 
         data-subtitle="Главная героиня" 
         data-desc="Новый член ордена 4 волшебников. Скромная девушка из поселения Бланс." 
         data-img="chararts/karolina.png">
      <img src="chararts/karolina.png" alt="Каролина">
      <div class="char-name">Каролина</div>
    </div>

    <!-- ПЕРСОНАЖ 2 -->
    <div class="char-card" 
         data-name="Некто" 
         data-subtitle="Главный герой" 
         data-desc="Новый член ордена 4 волшебников. Личность, чья история полна загадок." 
         data-img="chararts/nekto.jpg">
      <img src="chararts/nekto.jpg" alt="Некто">
      <div class="char-name">Некто</div>
    </div>

    <!-- ПЕРСОНАЖ 3 -->
    <div class="char-card" 
         data-name="Магнификус" 
         data-subtitle="Главный герой" 
         data-desc="Новый член ордена 4 волшебников. Безумный дед с амнезией. Любит коверкать имена и кидаться едой во всех, кто ему непригляден. А так же падок на артефакты и изготовление зелий." 
         data-img="chararts/magnifikus.jpg">
      <img src="chararts/magnifikus.jpg" alt="Магнификус">
      <div class="char-name">Магнификус</div>
    </div>

    <!-- ПЕРСОНАЖ 4 -->
    <div class="char-card" 
         data-name="Эра безлунной ночи" 
         data-subtitle="Главная героиня" 
         data-desc="Новый член ордена 4 волшебников. Загадочная и пронырная эльфийка с буйным характером." 
         data-img="chararts/era.jpg">
      <img src="chararts/era.jpg" alt="Эра">
      <div class="char-name">Эра</div>
    </div>

  </div>

  <!-- ===== САМО ВСПЛЫВАЮЩЕЕ ОКНО ===== -->
  <div class="modal-overlay" id="charModal">
    <div class="modal-content">
      <button class="close-btn" id="closeModal">✕</button>
      <img src="" id="modalImg" class="modal-img" alt="Персонаж">
      <div class="modal-info">
        <h2 id="modalName">Имя</h2>
        <div class="subtitle" id="modalSubtitle">Титул</div>
        <p id="modalDesc">Описание...</p>
      </div>
    </div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const modal = document.getElementById('charModal');
    const closeBtn = document.getElementById('closeModal');
    
    const modalImg = document.getElementById('modalImg');
    const modalName = document.getElementById('modalName');
    const modalSubtitle = document.getElementById('modalSubtitle');
    const modalDesc = document.getElementById('modalDesc');

    const cards = document.querySelectorAll('.char-card');

    cards.forEach(card => {
      card.addEventListener('click', () => {
        modalName.textContent = card.getAttribute('data-name');
        modalSubtitle.textContent = card.getAttribute('data-subtitle');
        modalDesc.textContent = card.getAttribute('data-desc');
        modalImg.src = card.getAttribute('data-img');

        modal.classList.add('active');
      });
    });

    function closeModal() {
      modal.classList.remove('active');
    }

    closeBtn.addEventListener('click', closeModal);

    modal.addEventListener('click', (e) => {
      if (e.target === modal) {
        closeModal();
      }
    });
  </script>
  
  <!-- ПОДКЛЮЧАЕМ ГЛОБАЛЬНЫЙ СКРИПТ МУЗЫКИ -->
  <script src="music.js"></script>
</body>
</html>
