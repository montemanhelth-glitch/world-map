<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Главное меню</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
   
    /* Стили для блока с ползунком музыки */
#music-controls {
  position: fixed;
  right: 15px;
  top: 15px;
  z-index: 1000;
  display: flex;
  align-items: center;
  gap: 8px;
  background: rgba(0, 0, 0, 0.7);
  padding: 8px 12px;
  border-radius: 20px;
  border: 1px solid #ffd700;
  color: #ffd700;
  font-size: 14px;
}

#volume-slider {
  width: 80px;
  cursor: pointer;
  accent-color: #ffd700;
}
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      /* Сюда потом вставишь свой арт. Пока - темный фон */
      background: #0d0d1a url('menu-bg.jpg') no-repeat center center;
      background-size: cover;
      font-family: -apple-system, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
    }

    /* Затемнение фона, чтобы кнопки читались на любом арте */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .menu-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 350px;
      padding: 20px;
      z-index: 2; /* чтобы кнопки были поверх затемнения */
    }

    .menu-btn {
      display: block;
      text-decoration: none;
      text-align: center;
      background: rgba(20, 20, 30, 0.85);
      color: #ffd700;
      font-size: 20px;
      font-weight: bold;
      padding: 18px;
      border: 2px solid #ffd700;
      border-radius: 12px;
      transition: 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
      text-shadow: 0 2px 4px #000;
    }

    .menu-btn:hover, .menu-btn:active {
      background: rgba(255, 215, 0, 0.2);
      transform: scale(1.05);
    }

    /* Неактивная кнопка (заглушка) */
    .menu-btn.disabled {
      color: #666;
      border-color: #444;
      background: rgba(10, 10, 15, 0.85);
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Плеер (скрыт) -->
<audio id="bg-music" loop>
  <source src="audio/music.mp3" type="audio/mpeg">
</audio>

<!-- Ползунок громкости в углу -->
<div id="music-controls">
  🔊 <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.2" title="Громкость">
</div>
  <div class="menu-container">
   
    <a href="index.html" class="menu-btn">🗺 Карта</a>
    
    <!-- Когда сделаешь страницы, замени href="#" на нужный файл и убери класс "disabled" -->
    <a href="#" class="menu-btn disabled">👤 Персонажи</a>
    <a href="#" class="menu-btn disabled">🏛 Боги</a>
    <a href="#" class="menu-btn disabled">🐉 Бестиарий</a>
  </div>

  <script>
    // ===== ЛОГИКА МУЗЫКИ ДЛЯ МЕНЮ =====
const music = document.getElementById('bg-music');
const volumeSlider = document.getElementById('volume-slider');

// Устанавливаем начальную громкость
music.volume = 0.2; // Громкость 20% (тихий фон)

// Функция попытки запуска
function tryPlayMusic() {
  music.play().then(() => {
    // Если музыка заиграла — убираем слушатели, чтобы не тратить ресурсы
    document.removeEventListener('click', tryPlayMusic);
    document.removeEventListener('touchstart', tryPlayMusic);
  }).catch(() => {
    // Если браузер заблокировал — ждем клика
  });
}

// 1. Пытаемся запустить сразу при загрузке
tryPlayMusic();

// 2. Если не вышло — запускаем при первом клике/тапе по экрану
document.addEventListener('click', tryPlayMusic);
document.addEventListener('touchstart', tryPlayMusic);

// Обработка ползунка
volumeSlider.addEventListener('input', (e) => {
  music.volume = e.target.value;
});
    
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }
  </script>
</body>
</html>
